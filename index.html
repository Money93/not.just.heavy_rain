<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>俚語傘｜互動 Demo</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Matter.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #f5f5f5;
            font-family:
                Arial,
                "Noto Sans TC",
                sans-serif;

            cursor: none;
        }

        #game {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        canvas {
            position: absolute;
            left: 0;
            top: 0;
            display: none;
            /* 隱藏 Matter.js 底層渲染，防止畫面閃爍與疊影 */
        }


        /* =========================
           上方資訊
        ========================= */

        #info {
            position: absolute;
            z-index: 100;

            top: 25px;
            left: 50%;

            transform: translateX(-50%);

            text-align: center;

            pointer-events: none;
        }

        #country {
            font-size: 32px;
            font-weight: 800;
        }

        #instruction {
            margin-top: 8px;

            font-size: 14px;
            color: #666;
        }


        /* =========================
           雨傘
        ========================= */

        #umbrella {
            position: absolute;

            z-index: 50;

            width: 150px;
            height: 150px;

            left: 50%;
            top: 70%;

            transform:
                translate(-50%, -50%) rotate(0deg);

            pointer-events: none;

            color: #000;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 220px;
            line-height: 1;
            user-select: none;
        }


        /* =========================
           掉落 Icon
        ========================= */

        .rain-object {

            position: absolute;

            z-index: 30;

            width: 60px;
            height: 60px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #000;

            pointer-events: none;

            transform-origin: center;
        }

        .rain-object i {

            font-size: 52px;

            line-height: 1;
        }

        /* 支援自訂 SVG 樣式 */
        .rain-object svg {
            width: 52px;
            height: 52px;
            stroke: currentColor;
        }


        /* =========================
           國家切換提示
        ========================= */

        #notice {

            position: absolute;

            inset: 0;

            z-index: 200;

            display: flex;

            align-items: center;
            justify-content: center;

            pointer-events: none;

            opacity: 1;

            transition:
                opacity 0.3s ease;
        }

        #notice.hidden {

            opacity: 0;
        }

        #notice-box {

            background: white;

            border: 3px solid black;

            padding:
                25px 45px;

            text-align: center;

            box-shadow:
                8px 8px 0 #000;
        }

        #notice-country {

            font-size: 38px;

            font-weight: 900;
        }

        #notice-idiom {

            margin-top: 10px;

            font-size: 20px;
        }

        /* =========================
   攝影機預覽樣式
========================= */

        #camera-controls {
            position: fixed;
            top: 90px;
            right: 20px;
            z-index: 1000;

            display: none;
            align-items: center;
            gap: 10px;

            padding: 10px 12px;
            border-radius: 12px;

            background: rgba(255, 255, 255, 0.88);
        }

        #camera-toggle-btn {
            padding: 8px 12px;
            border: none;
            border-radius: 8px;

            background: #34495e;
            color: white;

            cursor: pointer;
            font-size: 14px;
        }

        #camera-status {
            color: #34495e;
            font-size: 13px;
        }

        #camera-preview-wrapper {
            position: fixed;

            right: 20px;
            bottom: 20px;

            z-index: 999;

            width: 220px;
            max-height: 180px;

            overflow: hidden;

            border: 3px solid white;
            border-radius: 14px;
            background: #1f2933;
        }

        #camera-preview {
            display: block;
            width: 100%;
            height: auto;

            /** 左右鏡像修正 -1是像照鏡子一樣*/
            transform: scaleX(-1);
        }

        #camera-preview-label {
            padding: 6px 8px;

            color: white;
            background: #1f2933;

            text-align: center;
            font-size: 12px;
        }

        #camera-preview-wrapper.is-hidden {
            display: none;
        }

        #camera-toggle-btn {
            display: none;
        }
    </style>
</head>


<body>

    <div id="game">


        <!-- =========================
         上方資訊
    ========================== -->

        <div id="info">

            <div id="country">
                🇬🇧 英國
            </div>

            <div id="instruction">

                滑鼠自由移動雨傘
                ｜
                1 英國
                2 希臘
                3 葡萄牙

            </div>

        </div>

        <!-- 攝影機預覽控制 -->
        <div id="camera-controls">
            <button id="camera-toggle-btn" type="button">
                隱藏攝影機畫面
            </button>

            <span id="camera-status">
                攝影機準備中
            </span>
        </div>

        <!-- 攝影機畫面 -->
        <div id="camera-preview-wrapper">
            <video id="camera-preview" autoplay playsinline muted></video>

            <div id="camera-preview-label">
                攝影機測試畫面
            </div>

            <canvas id="tracking-canvas"></canvas>
        </div>


        <!-- =========================
         雨傘
    ========================== -->

        <div id="umbrella">
            ☂
        </div>


        <!-- =========================
         國家提示
    ========================== -->

        <div id="notice">

            <div id="notice-box">

                <div id="notice-country">
                    🇬🇧 英國
                </div>

                <div id="notice-idiom">
                    It's raining cats and dogs!
                </div>

            </div>

        </div>


    </div>


    <script>

        /* =========================================================
           Matter.js
        ========================================================= */

        const {
            Engine,
            Render,
            Runner,
            Bodies,
            Body,
            Composite,
            Events
        } = Matter;


        /* =========================================================
           建立物理世界
        ========================================================= */

        const engine = Engine.create();

        const world = engine.world;

        engine.gravity.y = 1.1;


        /* =========================================================
           畫面
        ========================================================= */

        const render = Render.create({

            element:
                document.getElementById("game"),

            engine: engine,

            options: {

                width:
                    window.innerWidth,

                height:
                    window.innerHeight,

                wireframes: false,

                background: "#f5f5f5",

                pixelRatio:
                    window.devicePixelRatio || 1
            }

        });


        Render.run(render);

        const runner = Runner.create();

        Runner.run(
            runner,
            engine
        );


        /* =========================================================
           國家資料
        ========================================================= */

        const countries = {

            1: {

                flag: "🇬🇧",

                name: "英國",

                idiom:
                    "It's raining cats and dogs!",

                icons: [
                    "cat",
                    "dog"
                ]

            },


            2: {

                flag: "🇬🇷",

                name: "希臘",

                idiom:
                    "It's raining chairs!",

                icons: [
                    "chair"
                ]

            },


            3: {

                flag: "🇵🇹",

                name: "葡萄牙",

                idiom:
                    "Chovem canivetes!",

                icons: [
                    "knife"
                ]

            }

        };


        let currentCountry =
            countries[1];


        /* =========================================================
           Icon 對照 (葡萄牙替換為自訂 SVG)
        ========================================================= */

        const iconHTML = {

            cat:
                '<i class="fa-solid fa-cat"></i>',

            dog:
                '<i class="fa-solid fa-dog"></i>',

            chair:
                '<i class="fa-solid fa-chair"></i>',

            knife:
                '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-slice"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M3 19l15 -15l3 3l-6 6l2 2a14 14 0 0 1 -14 4" /></svg>'

        };


        /* =========================================================
           雨傘
        ========================================================= */

        const umbrellaElement =
            document.getElementById("umbrella");


        let mouseX =
            window.innerWidth / 2;

        let mouseY =
            window.innerHeight * 0.7;

        let targetX = mouseX;
        let targetY = mouseY;


        /* =========================================================
           雨傘物理碰撞體（正向平衡弧度）
        ========================================================= */

        let umbrellaBody;


        function createUmbrellaBody() {

            const x = mouseX;
            const y = mouseY;


            const left =
                Bodies.rectangle(

                    x - 40,
                    y - 12,

                    80,
                    18,

                    {

                        label:
                            "umbrella",

                        isSensor:
                            false,

                        restitution:
                            1,

                        friction:
                            0.05,

                        render: {

                            visible:
                                false

                        }

                    }

                );


            const center =
                Bodies.rectangle(

                    x,
                    y - 25,

                    90,
                    18,

                    {

                        label:
                            "umbrella",

                        isSensor:
                            false,

                        restitution:
                            1,

                        friction:
                            0.05,

                        render: {

                            visible:
                                false

                        }

                    }

                );


            const right =
                Bodies.rectangle(

                    x + 40,
                    y - 12,

                    80,
                    18,

                    {

                        label:
                            "umbrella",

                        isSensor:
                            false,

                        restitution:
                            1,

                        friction:
                            0.05,

                        render: {

                            visible:
                                false

                        }

                    }

                );


            const handle =
                Bodies.rectangle(

                    x,
                    y + 30,

                    10,
                    70,

                    {

                        label:
                            "umbrella",

                        isSensor:
                            false,

                        restitution:
                            0.8,

                        friction:
                            0.1,

                        render: {

                            visible:
                                false

                        }

                    }

                );


            umbrellaBody =
                Body.create({

                    parts: [
                        left,
                        center,
                        right,
                        handle
                    ],

                    isStatic:
                        true,

                    label:
                        "umbrella",

                    render: {

                        visible:
                            false

                    }

                });


            Composite.add(
                world,
                umbrellaBody
            );

        }


        createUmbrellaBody();


        /* =========================================================
           滑鼠控制雨傘
        ========================================================= */

        /* window.addEventListener(
            "mousemove",
            function (event) {

                mouseX =
                    event.clientX;

                mouseY =
                    event.clientY;


                Body.setPosition(

                    umbrellaBody,

                    {

                        x:
                            mouseX,

                        y:
                            mouseY

                    }

                );


                Body.setVelocity(

                    umbrellaBody,

                    {

                        x: 0,

                        y: 0

                    }

                );

            }
        ); */


        /* =========================================================
           底部地面
        ========================================================= */

        let ground;


        function createGround() {

            const width =
                window.innerWidth;

            const height =
                window.innerHeight;


            ground =
                Bodies.rectangle(

                    width / 2,

                    height + 30,

                    width,

                    60,

                    {

                        isStatic:
                            true,

                        label:
                            "ground",

                        restitution:
                            0.05,

                        friction:
                            0.8,

                        render: {

                            visible:
                                false

                        }

                    }

                );


            Composite.add(
                world,
                ground
            );

        }


        createGround();


        /* =========================================================
           左右牆
        ========================================================= */

        let leftWall;
        let rightWall;


        function createSideWalls() {

            const width =
                window.innerWidth;

            const height =
                window.innerHeight;


            leftWall =
                Bodies.rectangle(

                    -25,

                    height / 2,

                    50,

                    height,

                    {

                        isStatic:
                            true,

                        label:
                            "sideWall",

                        restitution:
                            0.8,

                        friction:
                            0.2,

                        render: {

                            visible:
                                false

                        }

                    }

                );


            rightWall =
                Bodies.rectangle(

                    width + 25,

                    height / 2,

                    50,

                    height,

                    {

                        isStatic:
                            true,

                        label:
                            "sideWall",

                        restitution:
                            0.8,

                        friction:
                            0.2,

                        render: {

                            visible:
                                false

                        }

                    }

                );


            Composite.add(
                world,
                [
                    leftWall,
                    rightWall
                ]
            );

        }


        createSideWalls();


        /* =========================================================
           所有掉落物
        ========================================================= */

        const rainObjects =
            new Map();


        /* =========================================================
           建立掉落物
        ========================================================= */

        function spawnRain() {

            const type =
                currentCountry.icons[
                Math.floor(
                    Math.random() *
                    currentCountry.icons.length
                )
                ];


            const x =
                60 +
                Math.random() *
                (
                    window.innerWidth - 120
                );


            const y =
                -80;


            let radius = 27;

            let iconSize = 52;


            if (type === "chair") {

                radius = 31;

                iconSize = 58;

            }


            if (type === "knife") {

                radius = 27;

                iconSize = 52;

            }


            const body =
                Bodies.circle(

                    x,

                    y,

                    radius,

                    {

                        label:
                            "rain",

                        restitution:
                            0.25,

                        friction:
                            0.65,

                        frictionAir:
                            0.003,

                        density:
                            0.0015,

                        render: {

                            visible:
                                false

                        }

                    }

                );


            body.rainType =
                type;

            body.iconSize =
                iconSize;

            body.hitUmbrella =
                false;


            Composite.add(
                world,
                body
            );


            const element =
                document.createElement("div");


            element.className =
                "rain-object";


            element.style.width =
                iconSize + "px";


            element.style.height =
                iconSize + "px";


            // 插入對應 Icon 的 HTML 內容
            element.innerHTML =
                iconHTML[type];


            element.style.transform =
                `translate(${x - iconSize / 2}px, ${y - iconSize / 2}px)`;


            document
                .getElementById("game")
                .appendChild(element);


            body.element =
                element;


            rainObjects.set(
                body.id,
                body
            );

        }


        /* =========================================================
           移除掉落物
        ========================================================= */

        function removeRain(body) {

            Composite.remove(
                world,
                body
            );


            rainObjects.delete(
                body.id
            );


            if (body.element) {

                body.element.remove();

            }

        }


        /* =========================================================
           碰撞事件
        ========================================================= */

        Events.on(

            engine,

            "collisionStart",

            function (event) {


                event.pairs.forEach(

                    function (pair) {


                        const bodyA =
                            pair.bodyA;

                        const bodyB =
                            pair.bodyB;


                        let rain = null;

                        let other = null;


                        if (
                            bodyA.label === "rain"
                        ) {

                            rain =
                                bodyA;

                            other =
                                bodyB;

                        }

                        else if (
                            bodyB.label === "rain"
                        ) {

                            rain =
                                bodyB;

                            other =
                                bodyA;

                        }


                        if (!rain) {

                            return;

                        }


                        if (
                            other.label ===
                            "umbrella"
                            &&
                            !rain.hitUmbrella
                        ) {

                            rain.hitUmbrella =
                                true;


                            const dx =
                                rain.position.x -
                                umbrellaBody.position.x;


                            let direction;


                            if (dx < 0) {

                                direction = -1;

                            }

                            else {

                                direction = 1;

                            }


                            const horizontalPower =
                                14 +
                                Math.random() * 7;


                            const upwardPower =
                                5 +
                                Math.random() * 3;


                            Body.setVelocity(

                                rain,

                                {

                                    x:
                                        direction *
                                        horizontalPower,

                                    y:
                                        -upwardPower

                                }

                            );


                            Body.setAngularVelocity(

                                rain,

                                direction *
                                (
                                    0.2 +
                                    Math.random() *
                                    0.25
                                )

                            );


                            rain.frictionAir =
                                0.001;


                            setTimeout(

                                function () {

                                    if (
                                        rainObjects.has(
                                            rain.id
                                        )
                                    ) {

                                        removeRain(
                                            rain
                                        );

                                    }

                                },

                                900

                            );

                        }


                        if (
                            other.label ===
                            "ground"
                        ) {

                            if (
                                !rain.hitUmbrella
                            ) {

                            }

                        }

                    }

                );

            }

        );


        /* =========================================================
           更新畫面上的 Icon
        ========================================================= */

        Events.on(

            render,

            "afterRender",

            function () {

                umbrellaElement.style.left =
                    mouseX + "px";

                umbrellaElement.style.top =
                    mouseY + "px";

                umbrellaElement.style.transform =
                    `translate(-50%, -50%) rotate(${trackingAngle}rad)`;

                rainObjects.forEach(

                    function (body) {

                        if (
                            !body.element
                        ) {

                            return;

                        }

                        const size =
                            body.iconSize;

                        body.element.style.transform =
                            `
                    translate(
                        ${body.position.x - size / 2}px,
                        ${body.position.y - size / 2}px
                    )
                    rotate(${body.angle}rad)
                    `;
                    }
                );
            }
        );


        /* =========================================================
           國家切換
        ========================================================= */

        function switchCountry(number) {


            if (
                !countries[number]
            ) {

                return;

            }


            currentCountry =
                countries[number];


            document.getElementById(
                "country"
            ).textContent =

                currentCountry.flag +
                " " +
                currentCountry.name;


            document.getElementById(
                "notice-country"
            ).textContent =

                currentCountry.flag +
                " " +
                currentCountry.name;


            document.getElementById(
                "notice-idiom"
            ).textContent =

                currentCountry.idiom;


            rainObjects.forEach(

                function (body) {

                    removeRain(body);

                }

            );


            const notice =
                document.getElementById(
                    "notice"
                );


            notice.classList.remove(
                "hidden"
            );


            setTimeout(

                function () {

                    notice.classList.add(
                        "hidden"
                    );

                },

                1300

            );

        }


        /* =========================================================
           鍵盤切換國家
        ========================================================= */

        window.addEventListener(

            "keydown",

            function (event) {


                if (
                    event.key === "1" ||
                    event.key === "2" ||
                    event.key === "3"
                ) {

                    switchCountry(
                        Number(event.key)
                    );

                }

            }

        );


        /* =========================================================
           自動生成雨
        ========================================================= */

        let spawnTimer = 0;

        let nextSpawnTime =
            500;


        Events.on(

            engine,

            "beforeUpdate",

            function (event) {


                spawnTimer +=
                    event.delta;


                if (
                    spawnTimer >=
                    nextSpawnTime
                ) {

                    spawnRain();


                    spawnTimer = 0;


                    nextSpawnTime =

                        350 +
                        Math.random() * 450;

                }

            }

        );


        /* =========================================================
           保險機制
        ========================================================= */

        function cleanupObjects() {


            rainObjects.forEach(

                function (body) {


                    if (
                        body.hitUmbrella
                        &&
                        (
                            body.position.x <
                            -150
                            ||
                            body.position.x >
                            window.innerWidth + 150
                            ||
                            body.position.y >
                            window.innerHeight + 150
                        )
                    ) {

                        removeRain(body);

                    }


                    if (
                        body.hitUmbrella
                        &&
                        body.position.y >
                        window.innerHeight + 100
                    ) {

                        removeRain(body);

                    }

                }

            );


            requestAnimationFrame(
                cleanupObjects
            );

        }


        cleanupObjects();


        /* =========================================================
           Resize
        ========================================================= */

        /* window.addEventListener(

            "resize",

            function () {


                render.options.width =
                    window.innerWidth;

                render.options.height =
                    window.innerHeight;


                Composite.remove(
                    world,
                    ground
                );


                createGround();


                Composite.remove(
                    world,
                    [
                        leftWall,
                        rightWall
                    ]
                );


                createSideWalls();

            }

        ); */


        /* =========================================================
           開始
        ========================================================= */

        switchCountry(1);

        /* =========================攝影機預覽功能========================= */

        const cameraPreviewWrapper =
            document.getElementById("camera-preview-wrapper");

        const cameraPreview =
            document.getElementById("camera-preview");

        const cameraToggleButton =
            document.getElementById("camera-toggle-btn");

        const cameraStatus =
            document.getElementById("camera-status");

        let cameraStream = null;

        const trackingCanvas = document.getElementById("tracking-canvas");
        const trackingCtx = trackingCanvas.getContext("2d", {
            willReadFrequently: true
        });

        let trackingColor = null;
        let trackingX = 0;
        let trackingY = 0;

        // =========================
        // 🌂 雨傘旋轉設定
        // =========================

        // 雨傘一開始的角度
        let trackingAngle =
            -30 * Math.PI / 180;

        // 紅包「一開始」的角度
        let baseObjectAngle = null;

        // 是否已經完成初始角度校正
        let angleInitialized = false;

        let objectDetected = false;

        let lastDetectedCountry = null;

        const colorTargets = {
            red: {
                rMin: 150,
                gMax: 100,
                bMax: 100,
                country: 1
            },

            blue: {
                rMax: 100,
                gMax: 150,
                bMin: 120,
                country: 2
            },

            green: {
                rMax: 100,
                gMin: 120,
                bMax: 100,
                country: 3
            }
        };

        /*
         * 啟動攝影機
         */
        async function startCamera() {

            try {

                cameraStatus.textContent =
                    "正在啟動攝影機...";

                cameraStream =
                    await navigator.mediaDevices.getUserMedia({
                        video: true,
                        audio: false
                    });

                cameraPreview.srcObject =
                    cameraStream;

                cameraStatus.textContent =
                    "攝影機已啟動";

                detectObject();

            } catch (error) {

                console.error(
                    "攝影機啟動失敗：",
                    error
                );

                cameraStatus.textContent =
                    "無法使用攝影機，請確認權限";

                cameraToggleButton.disabled =
                    true;

            }

        }

        function detectObject() {

            // 每一幀開始時，先假設沒有偵測到物品
            objectDetected = false;

            if (!cameraPreview.videoWidth || !cameraPreview.videoHeight) {
                requestAnimationFrame(detectObject);
                return;
            }

            // 設定分析畫面的大小
            trackingCanvas.width = cameraPreview.videoWidth;
            trackingCanvas.height = cameraPreview.videoHeight;

            // 把攝影機畫面畫到 Canvas
            trackingCtx.drawImage(
                cameraPreview,
                0,
                0,
                trackingCanvas.width,
                trackingCanvas.height
            );

            // 取得所有像素
            const imageData = trackingCtx.getImageData(
                0,
                0,
                trackingCanvas.width,
                trackingCanvas.height
            );

            const pixels = imageData.data;

            let totalX = 0;
            let totalY = 0;
            let count = 0;

            let redCount = 0;
            let blueCount = 0;
            let greenCount = 0;

            let redX = 0;
            let redY = 0;

            let blueX = 0;
            let blueY = 0;

            let greenX = 0;
            let greenY = 0;

            let detectedColor = null;

            // 每 4 個數字代表一個像素：
            // R、G、B、A
            for (let y = 0; y < trackingCanvas.height; y += 4) {

                for (let x = 0; x < trackingCanvas.width; x += 4) {

                    const index =
                        (y * trackingCanvas.width + x) * 4;

                    const r = pixels[index];
                    const g = pixels[index + 1];
                    const b = pixels[index + 2];


                    // 🔴 紅色
                    if (
                        r > colorTargets.red.rMin &&
                        g < colorTargets.red.gMax &&
                        b < colorTargets.red.bMax
                    ) {
                        redCount++;
                        redX += x;
                        redY += y;
                    }


                    // 🔵 藍色
                    if (
                        r < colorTargets.blue.rMax &&
                        g < colorTargets.blue.gMax &&
                        b > colorTargets.blue.bMin
                    ) {
                        blueCount++;
                        blueX += x;
                        blueY += y;
                    }


                    // 綠色
                    if (
                        r < colorTargets.green.rMax &&
                        g > colorTargets.green.gMin &&
                        b < colorTargets.green.bMax
                    ) {
                        greenCount++;
                        greenX += x;
                        greenY += y;
                    }
                }
            }


            // 找出最多的顏色
            if (
                redCount > blueCount &&
                redCount > greenCount
            ) {
                detectedColor = "red";
            }
            else if (
                blueCount > redCount &&
                blueCount > greenCount
            ) {
                detectedColor = "blue";
            }
            else if (
                greenCount > redCount &&
                greenCount > blueCount
            ) {
                detectedColor = "green";
            }

            let currentCount = 0;
            let currentX = 0;
            let currentY = 0;

            const minimumPixels = 30;

            if (detectedColor === "red") {

                currentCount = redCount;
                currentX = redX;
                currentY = redY;

            }
            else if (detectedColor === "blue") {

                currentCount = blueCount;
                currentX = blueX;
                currentY = blueY;

            }
            else if (detectedColor === "green") {

                currentCount = greenCount;
                currentX = greenX;
                currentY = greenY;

            }

            if (
                detectedColor !== null &&
                currentCount > minimumPixels
            ) {

                objectDetected = true;

                trackingColor = detectedColor;

                trackingX =
                    currentX / currentCount;

                trackingY =
                    currentY / currentCount;

                // 切換國家

                const currentCountry =
                    colorTargets[detectedColor].country;

                if (
                    lastDetectedCountry !== currentCountry
                ) {

                    switchCountry(currentCountry);

                    lastDetectedCountry =
                        currentCountry;

                    // 換顏色時重新校正旋轉角度
                    angleInitialized = false;
                }

                // =========================
                // 🔄 旋轉偵測
                // =========================

                const centerX = trackingX;
                const centerY = trackingY;

                let sumXX = 0;
                let sumYY = 0;
                let sumXY = 0;

                const target =
                    colorTargets[detectedColor];

                for (
                    let y = 0;
                    y < trackingCanvas.height;
                    y += 4
                ) {

                    for (
                        let x = 0;
                        x < trackingCanvas.width;
                        x += 4
                    ) {

                        const index =
                            (y * trackingCanvas.width + x) * 4;

                        const r =
                            pixels[index];

                        const g =
                            pixels[index + 1];

                        const b =
                            pixels[index + 2];

                        let isTargetColor = false;

                        // 🔴 紅色
                        if (detectedColor === "red") {

                            isTargetColor =
                                r > target.rMin &&
                                g < target.gMax &&
                                b < target.bMax;

                        }

                        // 🔵 藍色
                        else if (detectedColor === "blue") {

                            isTargetColor =
                                r < target.rMax &&
                                g < target.gMax &&
                                b > target.bMin;

                        }

                        // 🟢 綠色
                        else if (detectedColor === "green") {

                            isTargetColor =
                                r < target.rMax &&
                                g > target.gMin &&
                                b < target.bMax;

                        }

                        // 如果是目前正在追蹤的顏色
                        if (isTargetColor) {

                            const dx =
                                x - centerX;

                            const dy =
                                y - centerY;

                            sumXX +=
                                dx * dx;

                            sumYY +=
                                dy * dy;

                            sumXY +=
                                dx * dy;

                        }

                    }

                }

                const detectedAngle =
                    -0.5 *
                    Math.atan2(
                        2 * sumXY,
                        sumXX - sumYY
                    );

                if (!angleInitialized) {

                    baseObjectAngle =
                        detectedAngle;

                    angleInitialized =
                        true;
                }

                let relativeAngle =
                    detectedAngle -
                    baseObjectAngle;

                while (
                    relativeAngle >
                    Math.PI / 2
                ) {

                    relativeAngle -=
                        Math.PI;
                }

                while (
                    relativeAngle <
                    -Math.PI / 2
                ) {

                    relativeAngle +=
                        Math.PI;
                }

                const rotationPower = 1.0;

                const rotationSmooth = 0.35;

                const targetAngle =
                    (-30 * Math.PI / 180) +
                    relativeAngle * rotationPower;

                trackingAngle +=
                    (targetAngle - trackingAngle) *
                    rotationSmooth;

            }

            // =========================
            // 📍 攝影機座標 → 螢幕座標
            // =========================

            if (objectDetected) {

                const cameraWidth = trackingCanvas.width;
                const cameraHeight = trackingCanvas.height;

                // 因為你的攝影機畫面是左右鏡像
                // 所以 X 要反過來
                const mirroredX =
                    cameraWidth - trackingX;

                targetX =
                    (mirroredX / cameraWidth) *
                    window.innerWidth;

                targetY =
                    (trackingY / cameraHeight) *
                    window.innerHeight;

                // 平滑移動
                const smooth = 0.15;

                mouseX += (targetX - mouseX) * smooth;
                mouseY += (targetY - mouseY) * smooth;

                // 更新雨傘物理位置
                Body.setPosition(
                    umbrellaBody,
                    {
                        x: mouseX,
                        y: mouseY
                    }
                );

                Body.setVelocity(
                    umbrellaBody,
                    {
                        x: 0,
                        y: 0
                    }
                );
            }

            requestAnimationFrame(detectObject);
        }

        /*
         * 顯示／隱藏攝影機畫面
         */
        function toggleCameraPreview() {

            const isHidden =
                cameraPreviewWrapper.classList.toggle(
                    "is-hidden"
                );

            if (isHidden) {

                cameraToggleButton.textContent =
                    "顯示攝影機畫面";

                cameraStatus.textContent =
                    "攝影機運作中（畫面已隱藏）";

            } else {

                cameraToggleButton.textContent =
                    "隱藏攝影機畫面";

                cameraStatus.textContent =
                    "攝影機預覽已顯示";

            }

        }


        /*
         * 綁定按鈕
         */
        cameraToggleButton.addEventListener(
            "click",
            toggleCameraPreview
        );

        /*
         * 按下鍵盤 D 鍵切換攝影機預覽
         */
        document.addEventListener("keydown", function (event) {

            // 不分大小寫，d 和 D 都可以使用
            if (event.key.toLowerCase() === "d") {

                toggleCameraPreview();

            }

        });

        /*
         * 頁面載入後啟動攝影機
         */
        if (
            navigator.mediaDevices &&
            navigator.mediaDevices.getUserMedia
        ) {

            startCamera();

        } else {

            cameraStatus.textContent =
                "此瀏覽器不支援攝影機功能";

            cameraToggleButton.disabled =
                true;

        }

    </script>
