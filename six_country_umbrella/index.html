<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>俚語傘｜雙人互動 Demo</title>


    <!-- Font Awesome -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


    <!-- Matter.js -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>


    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #f5f5f5;
            font-family: "Huninn", "Noto Sans TC", sans-serif;

            cursor: none;
        }

        #game {
            position: relative;

            width: 100vw;
            height: 100vh;

            overflow: hidden;
        }

        /* 背景普通雨滴 */

        #background-rain {
            position: absolute;
            inset: 0;
            z-index: 40;
            overflow: hidden;
            pointer-events: none;

            background: #142B49;
            opacity: 1;
            transition: opacity 1.5s ease;
        }

        /* 玩家出現時，背景雨滴淡出 */
        #background-rain.hide {
            opacity: 0;
        }

        .background-raindrop {
            position: absolute;
            top: -100px;

            width: 2px;
            height: 30px;

            background: linear-gradient(to bottom,
                    rgba(255, 255, 255, 0),
                    rgba(255, 255, 255, 0.85));

            border-radius: 50%;

            animation: backgroundRainFall linear infinite;

            pointer-events: none;
        }

        @keyframes backgroundRainFall {
            from {
                transform: translate3d(0, -100px, 0) rotate(8deg);
            }

            to {
                transform: translate3d(-35px, 120vh, 0) rotate(8deg);
            }
        }

        canvas {
            display: none;
        }

        /* 上方文字 */

        #info {
            position: absolute;

            z-index: 100;

            top: 25px;
            left: 50%;

            transform: translateX(-50%);

            text-align: center;

            pointer-events: none;
        }

        #title {
            font-size: 32px;

            font-weight: 800;
        }

        #status {
            margin-top: 8px;

            font-size: 14px;

            color: #666;
        }

        /* 雨傘 */

        .umbrella {
            position: absolute;

            z-index: 50;

            width: 150px;
            height: 150px;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 220px;

            line-height: 1;

            pointer-events: none;

            user-select: none;

            opacity: 0;

            transition: opacity .15s;
        }

        .umbrella.show {
            opacity: 1;
        }

        /* 雨 */

        .rain-object {
            position: absolute;

            z-index: 30;

            width: 60px;
            height: 60px;

            display: flex;

            align-items: center;
            justify-content: center;

            pointer-events: none;

            transform-origin: center;
            visibility: hidden;
        }

        .rain-object i {
            font-size: 52px;

            line-height: 1;
        }

        .rain-object svg {
            width: 52px;
            height: 52px;

            stroke: currentColor;
        }

        /* 國家 / 俚語提示卡 */

        #notice {
            position: absolute;

            inset: 0;

            z-index: 200;

            display: flex;

            align-items: center;
            justify-content: center;

            pointer-events: none;

            opacity: 0;

            transition: opacity .3s;
        }

        #notice.show {
            opacity: 1;
        }

        #notice-box {
            min-width: 380px;

            background: white;

            border: 3px solid black;

            padding: 30px 50px;

            text-align: center;

            box-shadow: 8px 8px 0 #000;

            transform: translateY(10px);

            transition:
                transform .3s ease;
        }

        #notice.show #notice-box {
            transform: translateY(0);
        }

        #notice-country {
            font-size: 42px;

            font-weight: 900;
        }

        #notice-idiom {
            margin-top: 15px;

            font-size: 22px;

            font-weight: 500;

            line-height: 1.5;
        }

        /* 國家小提示 */

        #notice-type {
            margin-top: 10px;

            font-size: 15px;

            color: #666;
        }

        /* 遊戲結算畫面 */

        #result-screen {
            position: absolute;
            inset: 0;
            z-index: 300;

            display: none;
            align-items: center;
            justify-content: center;

            background: rgba(245, 245, 245, 0.94);
            padding: 20px;
        }

        #result-screen.show {
            display: flex;
        }

        #result-box {
            width: 100%;
            max-width: 560px;

            padding: 35px;
            background: white;

            border: 3px solid #222;
            box-shadow: 8px 8px 0 #222;

            text-align: center;
        }

        #result-title {
            font-size: 36px;
            font-weight: 900;
            margin-bottom: 12px;
        }

        #result-message {
            font-size: 18px;
            line-height: 1.8;
            margin-bottom: 24px;
        }

        #result-counts {
            display: flex;
            justify-content: center;
            gap: 18px;
            flex-wrap: wrap;
            margin-bottom: 28px;
        }

        .result-item {
            min-width: 100px;
            padding: 15px 10px;
            border: 2px solid #222;
        }

        .result-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .result-number {
            font-size: 26px;
            font-weight: 900;
        }

        /*  開場主題文字 */
        #intro-text {
            position: absolute;

            opacity: 1;
            transition: opacity 1.5s ease;

            /* 畫面水平、垂直置中 */
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation:
                introFloat 4s ease-in-out infinite,
                textGlow 5s ease-in-out infinite;

            /* 文字外觀 */
            width: 90%;
            text-align: center;
            font-family: "Huninn", "Noto Sans TC", sans-serif;
            font-size: clamp(48px, 6vw, 90px);
            font-weight: normal;
            letter-spacing: 0.12em;
            line-height: 1.6;

            /* 文字顏色與陰影 */
            color: #ffffff;
            text-shadow:
                0 0 5px rgba(255, 255, 255, 0.9),
                0 0 15px rgba(200, 225, 255, 0.65),
                0 0 30px rgba(130, 190, 255, 0.35);

            /* 確保文字在雨滴上方 */
            z-index: 45;

            /* 不阻擋攝影機或遊戲互動 */
            pointer-events: none;
        }

        #intro-text.hide {
            opacity: 0;
        }

        /* 開場文字上下漂浮動畫 */
        @keyframes introFloat {

            0%,
            100% {
                transform: translate(-50%, -50%) translateY(0px);
            }

            50% {
                transform: translate(-50%, -50%) translateY(-18px);
            }
        }

        /* === 遊戲倒數計時器 === */

        #game-timer {
            position: absolute;
            top: 30px;
            right: 35px;
            z-index: 150;

            padding: 12px 24px;
            background: #ffffff;
            border: 3px solid #222222;

            text-align: center;
            pointer-events: none;

            display: none;
        }

        /* 遊戲開始後顯示 */
        #game-timer.show {
            display: block;
        }

        /* 剩餘時間文字 */
        #timer-label {
            font-size: 14px;
            color: #666666;
            margin-bottom: 5px;
        }

        /* 倒數數字 */
        #timer-number {
            font-size: 36px;
            font-weight: 800;
            color: #222222;
            font-variant-numeric: tabular-nums;
        }

        @font-face {
            font-family: "Huninn";
            src: url("./jf-openhuninn-2.1.ttf") format("truetype");
            font-weight: normal;
            font-style: normal;
        }

        /* 開場文字呼吸發光 */
        @keyframes textGlow {

            0%,
            100% {
                text-shadow:
                    0 0 5px rgba(255, 255, 255, 0.7),
                    0 0 12px rgba(200, 225, 255, 0.4),
                    0 0 25px rgba(130, 190, 255, 0.2);
            }

            50% {
                text-shadow:
                    0 0 8px rgba(255, 255, 255, 1),
                    0 0 20px rgba(200, 225, 255, 0.8),
                    0 0 40px rgba(130, 190, 255, 0.5);
            }
        }

        /* 結算 QR Code */
        #result-qr-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-top: 20px;
        }

        #result-qrcode {
            background: white;
            padding: 12px;
        }

        #result-qr-area p {
            font-size: 18px;
            color: #333;
            margin: 0;
        }

        /* 六國俚語倒數｜夢幻星光版本 */
        #idiom-progress {
            position: absolute;
            top: 30px;
            left: 50%;
            width: 96%;
            transform: translateX(-50%);
            z-index: 120;

            display: none;
            flex-direction: column;
            align-items: center;
            gap: 6px;

            text-align: center;
            pointer-events: none;

            animation: idiomAreaFloat 5s ease-in-out infinite;
        }

        #idiom-progress.show {
            display: flex;
        }

        #idiom-country {
            font-size: 32px;
            font-weight: normal;
            color: #316CAB;
            flex-shrink: 0;
            white-space: nowrap;
            text-shadow:
                0 0 5px rgba(255, 255, 255, 0.95),
                0 0 10px rgba(110, 180, 255, 0.7),
                0 0 22px rgba(110, 180, 255, 0.4);
            animation: countryGlow 3s ease-in-out infinite;
        }

        #idiom-text {
            font-size: 32px;
            line-height: 1.5;
            font-weight: 600;
            font-family: "Huninn", "Noto Sans TC", sans-serif;
            text-align: center;
            white-space: nowrap;
            overflow-wrap: break-word;
        }

        /* 每個字元的容器 */
        .idiom-char {
            position: relative;
            display: inline-block;
            vertical-align: baseline;
            white-space: pre;
        }

        /* 原本逐字點亮的文字 */
        .idiom-base {
            color: #D0D6DE;
            opacity: 1;

            transition:
                color 0.8s ease,
                text-shadow 0.8s ease,
                opacity 0.9s ease;
        }

        .idiom-char.lit .idiom-base {
            color: #316CAB;

            text-shadow:
                0 0 5px rgba(255, 255, 255, 0.95),
                0 0 10px rgba(110, 180, 255, 0.7),
                0 0 22px rgba(110, 180, 255, 0.4);
        }

        /* 點亮後的細微浮動 */
        .idiom-char.lit {
            animation: idiomLetterFloat 3s ease-in-out infinite;
        }

        /* 星光另外疊在文字上，不中斷浮動動畫 */
        .idiom-spark-layer {
            position: absolute;
            inset: 0;
            opacity: 0;
            pointer-events: none;

            transition: opacity 0.9s ease;
        }

        .idiom-spark {
            display: inline-block;
            color: #316CAB;

            animation:
                idiomStarTwinkle var(--twinkle-duration, 1s) ease-in-out infinite alternate;

            animation-delay: var(--twinkle-delay, 0s);
        }

        /* 最後五秒：由正常文字漸變到星光 */
        #idiom-progress.final-glow .idiom-base {
            opacity: 0.35;
        }

        #idiom-progress.final-glow .idiom-spark-layer {
            opacity: 1;
        }

        /* 每個字不同頻率的星光閃爍 */
        @keyframes idiomStarTwinkle {
            0% {
                opacity: 0;
                text-shadow: none;
            }

            50% {
                opacity: 0.65;
                text-shadow:
                    0 0 8px rgba(110, 180, 255, 0.6),
                    0 0 16px rgba(110, 180, 255, 0.35);
            }

            100% {
                opacity: 1;
                text-shadow:
                    0 0 5px rgba(255, 255, 255, 1),
                    0 0 12px rgba(110, 180, 255, 0.95),
                    0 0 26px rgba(110, 180, 255, 0.75),
                    0 0 40px rgba(110, 180, 255, 0.4);
            }
        }

        @keyframes idiomLetterFloat {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-3px);
            }
        }

        @keyframes idiomAreaFloat {

            0%,
            100% {
                transform: translateX(-50%) translateY(0);
            }

            50% {
                transform: translateX(-50%) translateY(-5px);
            }
        }

        /* 國名＋俚語同一排 */
        #idiom-line {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: baseline;

            gap: 26px;
            width: max-content;
            max-width: 100%;

            white-space: nowrap;
            will-change: transform, opacity;
        }

        /* 國家名稱緩慢呼吸發光 */
        @keyframes countryGlow {

            0%,
            100% {
                text-shadow:
                    0 0 4px rgba(255, 255, 255, 0.9),
                    0 0 9px rgba(110, 180, 255, 0.35),
                    0 0 18px rgba(110, 180, 255, 0.2);
            }

            50% {
                text-shadow:
                    0 0 6px rgba(255, 255, 255, 1),
                    0 0 14px rgba(110, 180, 255, 0.8),
                    0 0 28px rgba(110, 180, 255, 0.5);
            }
        }

        /* 最後 5 秒：國家名稱星光閃爍 */
        #idiom-progress.final-glow #idiom-country {
            animation: countryStarTwinkle 1.4s ease-in-out infinite alternate;
        }

        @keyframes countryStarTwinkle {
            0% {
                opacity: 0.5;

                text-shadow:
                    0 0 3px rgba(110, 180, 255, 0.2);
            }

            100% {
                opacity: 1;

                text-shadow:
                    0 0 8px rgba(255, 255, 255, 1),
                    0 0 16px rgba(110, 180, 255, 0.9),
                    0 0 28px rgba(110, 180, 255, 0.6);
            }
        }

        /* 換國家 +10 秒｜放大發光特效 */
        /* +10s 平常隱藏，不影響俚語排版 */
        #idiom-bonus {
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);

            font-family: "Huninn", "Noto Sans TC", sans-serif;
            font-size: 28px;
            font-weight: 600;
            color: #316CAB;
            white-space: nowrap;

            opacity: 0;
            pointer-events: none;
        }

        /* 觸發加秒時，+10s 向上飄並淡出 */
        #idiom-bonus.show-bonus {
            animation: idiomBonusFloat 1.1s ease-out both;
        }

        @keyframes idiomBonusFloat {
            0% {
                opacity: 0;
                transform: translate(-50%, 14px) scale(0.85);
                text-shadow: none;
            }

            15% {
                opacity: 1;
                transform: translate(-50%, 0) scale(1.12);
                text-shadow:
                    0 0 8px rgba(255, 255, 255, 1),
                    0 0 18px rgba(110, 180, 255, 0.9),
                    0 0 32px rgba(110, 180, 255, 0.5);
            }

            50% {
                opacity: 1;
                transform: translate(-50%, -5px) scale(1);
            }

            100% {
                opacity: 0;
                transform: translate(-50%, -18px) scale(0.95);
                text-shadow: none;
            }
        }

        /* ===== 傾斜撞擊特效：不變更純白背景 ===== */
        #rain-fx-layer {
            position: absolute;
            inset: 0;
            z-index: 85;
            overflow: hidden;
            pointer-events: none;
        }

        .rain-impact {
            position: absolute;
            width: 64px;
            height: 64px;
            margin: -32px 0 0 -32px;
            pointer-events: none;
            will-change: transform, opacity;
        }

        .rain-impact::before,
        .rain-impact::after {
            content: '';
            position: absolute;
            inset: 0;
            border: 2px solid rgba(66, 129, 186, .7);
            border-radius: 50%;
            box-shadow: 0 0 12px rgba(83, 150, 210, .18);
        }

        .rain-impact.slow::before {
            animation: rainRippleSlow 1050ms cubic-bezier(.16, .65, .35, 1) both;
        }

        .rain-impact.slow::after {
            animation: rainRippleSlow 1050ms 160ms cubic-bezier(.16, .65, .35, 1) both;
        }

        @keyframes rainRippleSlow {
            0% {
                opacity: .8;
                transform: scale(.35);
            }

            100% {
                opacity: 0;
                transform: scale(4.5);
            }
        }

        .rain-impact.fast::before,
        .rain-impact.fast::after {
            border-radius: 5px;
            border-width: 3px;
            border-color: rgba(41, 110, 180, .72);
            box-shadow: 0 0 8px rgba(49, 108, 171, .25);
        }

        .rain-impact.fast::before {
            animation: rainRippleFast 550ms cubic-bezier(.1, .75, .25, 1) both;
        }

        .rain-impact.fast::after {
            animation: rainRippleFast 550ms 90ms cubic-bezier(.1, .75, .25, 1) both;
        }

        @keyframes rainRippleFast {
            0% {
                opacity: 1;
                transform: rotate(45deg) scale(.35);
            }

            100% {
                opacity: 0;
                transform: rotate(45deg) scale(4.7);
            }
        }

        /* 加速期間才顯示少量短線，純白背景依舊保留 */
        #rain-speed-layer {
            position: absolute;
            inset: 0;
            z-index: 35;
            overflow: hidden;
            pointer-events: none;
            opacity: 0;
            transition: opacity .3s ease;
        }

        #game.rain-fast #rain-speed-layer {
            opacity: 1;
        }

        .rain-speed-streak {
            position: absolute;
            top: -22vh;
            left: var(--streak-x);
            width: 2px;
            height: var(--streak-h);
            border-radius: 100px;
            background: linear-gradient(to bottom, transparent, rgba(83, 139, 193, .28), transparent);
            animation: rainSpeedStreak var(--streak-duration) linear infinite;
            animation-delay: var(--streak-delay);
            will-change: transform;
        }

        @keyframes rainSpeedStreak {
            from {
                transform: translate3d(10px, -10vh, 0) rotate(9deg);
            }

            to {
                transform: translate3d(-24px, 145vh, 0) rotate(9deg);
            }
        }

        @media (prefers-reduced-motion: reduce) {

            .rain-impact::before,
            .rain-impact::after {
                animation-duration: .1ms !important;
            }

            .rain-speed-streak {
                animation: none;
            }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="collision_data.js"></script>
</head>


<body>

    <div id="game">

        <!-- 背景普通雨滴 -->
        <div id="background-rain"></div>

        <!-- 開場主題文字 -->
        <div id="intro-text">
            同一場雨，世界會怎麼說？
        </div>

        <!-- 六國實體傘的畫面位置由 JavaScript 自動建立 -->
        <div id="umbrellas"></div>

        <!-- 撞擊波紋與快速雨短線；都不擋滑鼠和雨傘 -->
        <div id="rain-speed-layer" aria-hidden="true"></div>
        <div id="rain-fx-layer" aria-hidden="true"></div>

        <!-- 六國俚語倒數顯示 -->
        <div id="idiom-progress">
            <div id="idiom-line">
                <div id="idiom-country"></div>
                <div id="idiom-text"></div>
            </div>
            <!-- 換國家增加時間的提示 -->
            <div id="idiom-bonus">+10s</div>
        </div>

        <!-- 國家 / 俚語提示 -->
        <div id="notice">

            <div id="notice-box">

                <div id="notice-country">
                    英國
                </div>

                <div id="notice-idiom">
                    It's raining cats and dogs!
                </div>

                <div id="notice-type">
                    貓狗雨
                </div>

            </div>

        </div>

        <!-- 遊戲結算畫面 -->
        <div id="result-screen">

            <div id="result-box">

                <div id="result-title">
                    你被淹沒了！
                </div>

                <div id="result-message">
                    這場雨真是太驚人了！
                </div>

                <div id="result-counts"></div>

                <!-- 結算 QR Code -->
                <div id="result-qr-area">
                    <div id="result-qrcode"></div>
                    <p>掃描 QR Code，帶走你的俚雨！</p>
                </div>

            </div>

        </div>

        <!-- 無倒數與百分比，堆積觸及隱形淹沒線後自動結算 -->

    </div>


    <script>
        "use strict";
        // === 六國對照表：與 main_six.py 的 keys 一致 ===
        const COUNTRIES = {
            red: { country: '英國', type: '貓狗雨', idiom: "It's raining cats and dogs!", drops: ['cat', 'dog'], color: '#E53935' },
            blue: { country: '希臘', type: '椅腳雨', idiom: "Βρέχει καρεκλοπόδαρα!", drops: ['chair'], color: '#1976D2' },
            yellow: { country: '葡萄牙', type: '刀子雨', idiom: "Chovem canivetes!", drops: ['knife'], color: '#FFDF00' },
            green: { country: '波蘭', type: '青蛙雨', idiom: "Pierze żabami!", drops: ['frog'], color: '#00C853' },
            purple: { country: '法國', type: '繩子雨', idiom: 'Il pleut des cordes !', drops: ['rope'], color: '#A000E8' },
            orange: { country: '巴西', type: '蛇與蜥蜴雨', idiom: "Chovem cobras e lagartos!", drops: ['snake', 'lizard'], color: '#FF8800' }
        };
        // 這些是展覽上的趣味解說文字，並非當地俚語原文的語言學考證。
        const DROP_INFO = {
            cat: { name: '貓咪', icon: '🐱', art: '<i class="fa-solid fa-cat"></i>', radius: 27, size: 52 },
            dog: { name: '狗狗', icon: '🐶', art: '<i class="fa-solid fa-dog"></i>', radius: 27, size: 52 },
            chair: { name: '椅腳／椅子', icon: '🪑', art: '<i class="fa-solid fa-chair"></i>', radius: 31, size: 58 },
            knife: { name: '刀子', icon: '🔪', art: '<i class="fa-solid fa-utensils"></i>', radius: 27, size: 52 },
            frog: { name: '青蛙', icon: '🐸', art: '<i class="fa-solid fa-frog"></i>', radius: 27, size: 52 },

            rainObjects.set(body.id, body);
        }
        function removeRain(body) { if (!rainObjects.has(body.id)) return; Composite.remove(world, body); rainObjects.delete(body.id); body.element?.remove(); }
        function deflectRain(rain, direction, umbrella = null) {
            if (!rain || !rainObjects.has(rain.id) || rain.hitUmbrella || rain.settled) return false;
            rain.hitUmbrella = true;
            deflectedCounts[rain.rainType] = (deflectedCounts[rain.rainType] || 0) + 1;
            if (rain.isSleeping) Sleeping.set(rain, false);
            setCollisionMask(rain, 0); rain.stationarySince = 0;
            Body.setVelocity(rain, { x: direction * (17 + Math.random() * 6), y: -(7 + Math.random() * 3) });
            Body.setAngularVelocity(rain, direction * (.22 + Math.random() * .2));
            rain.frictionAir = .001;
            setTimeout(() => removeRain(rain), 650);
            return true;
        }
        // 每幀同步雨傘圖案與 Matter.js 碰撞體位置及角度。
        Events.on(engine, 'beforeUpdate', () => {
            for (const id of ids) {
                const s = states[id];
                if (!s.visible) continue;
                s.displayAngle += (s.targetAngle - s.displayAngle) * TILT_EASE;
                Body.setPosition(s.body, { x: s.x, y: s.y });
                Body.setAngle(s.body, (s.displayAngle + 30) * Math.PI / 180);
                Body.setVelocity(s.body, { x: 0, y: 0 });
            }
        });
        // 複合碰撞必須從子部件回溯 parent；collisionActive 補足高速移動/接觸持續的情況。
        function onUmbrellaCollision(event) {
            for (const pair of event.pairs) {
                const a = collisionRoot(pair.bodyA), b = collisionRoot(pair.bodyB);
                const rain = a?.label === 'rain' ? a : b?.label === 'rain' ? b : null;
                if (!rain || !rainObjects.has(rain.id) || rain.hitUmbrella || rain.settled) continue;
                const umbrella = rain === a ? b : a;
                if (!umbrella || !ids.some(id => umbrella === states[id].body && states[id].visible)) continue;
                const s = ids.map(id => states[id]).find(v => v.body === umbrella);
                // 傾斜後撞擊成功，才觸發全場變速與碰撞波紋；一般角度不觸發
                if (s) triggerRainEffect(s.tilt, rain.position.x, rain.position.y);
                // 被撞到的單一物件仍照原本機制彈飛消失
                const dir = rain.position.x < umbrella.position.x ? -1 : 1;
                deflectRain(rain, dir, umbrella);
            }
        }
        Events.on(engine, 'collisionStart', onUmbrellaCollision);
        Events.on(engine, 'collisionActive', onUmbrellaCollision);
        Events.on(render, 'afterRender', () => {
            for (const id of ids) { const s = states[id]; if (s.visible) { s.el.style.left = s.x + 'px'; s.el.style.top = s.y + 'px'; s.el.style.transform = `translate(-50%,-50%) rotate(${s.displayAngle}deg)`; } }
            rainObjects.forEach(body => { const n = body.iconSize, o = body.elementOffset || { x: 0, y: 0 }; const cs = Math.cos(body.angle), sn = Math.sin(body.angle); const ox = o.x * cs - o.y * sn, oy = o.x * sn + o.y * cs; body.element.style.transform = `translate(${body.position.x + ox - n / 2}px,${body.position.y + oy - n / 2}px) rotate(${body.angle}rad)`; });
            if (performance.now() - lastVideoDraw > 55) { rainObjects.forEach(renderVideoFrame); lastVideoDraw = performance.now(); }
        });
        // 隱形淹沒線：僅將「確實堆積穩定」的物件列入，避免飛過的物件誤觸。
        // 不再以長條百分比表示堆積量，也不要求相連的水平格全都滿。
        function checkFloodLine(now) {
            if (!gameStarted || gameEnded || now - lastFloodCheck < FLOOD_CHECK_MS) return;
            lastFloodCheck = now;
            const lineY = innerHeight * (1 - FLOOD_LINE_HEIGHT_RATIO);
            const zones = new Set();
            const stableBodies = [];
            rainObjects.forEach(body => {
                if (body.hitUmbrella || !body.settled || !body.bounds) return;
                if (body.bounds.max.y < 0 || body.bounds.min.y > innerHeight + 5) return;
                stableBodies.push(body);
                // 穩定物件自身上沿越過淹沒線才算；每件物件只占一區。
                if (body.bounds.min.y <= lineY) {
                    const zone = clamp(Math.floor(body.position.x / innerWidth * FLOOD_ZONE_COUNT), 0, FLOOD_ZONE_COUNT - 1);
                    zones.add(zone);
                }
            });
            if (zones.size >= FLOOD_MIN_ZONES) {
                if (floodReachedAt === null) floodReachedAt = now;
                if (now - floodReachedAt >= FLOOD_HOLD_MS) endGame();
            } else floodReachedAt = null;
        }
        function nextRainDelay() {
            let settled = 0;
            rainObjects.forEach(body => { if (body.settled && !body.hitUmbrella) settled++; });
            const progress = clamp(settled / RAIN_SLOW_AT_SETTLED, 0, 1);
            // 緩慢改變生成速度，避免一跨過門檻就突然變快或變慢。
            return (RAIN_DELAY_LOW_MS + (RAIN_DELAY_HIGH_MS - RAIN_DELAY_LOW_MS) * progress) * (0.85 + Math.random() * 0.3);
        }
        Events.on(engine, 'afterUpdate', () => checkFloodLine(performance.now()));
        function endGame() {
            if (gameEnded) return; gameEnded = true;
            game.classList.remove('rain-fast');
            // 遊戲結束，隱藏俚語動畫
            idiomProgress.classList.remove('show');
            idiomProgress.classList.remove('final-glow');
            if (gameTimeoutId !== null) { clearTimeout(gameTimeoutId); gameTimeoutId = null; }
            // 與舊版一致：統計結算當下尚未被移除、且非已彈飛的雨物件。
            const counts = Object.fromEntries(Object.keys(DROP_INFO).map(k => [k, 0]));
            rainObjects.forEach(b => { if (!b.hitUmbrella && counts[b.rainType] !== undefined) counts[b.rainType]++; });
            resultCounts.innerHTML = '';
            const nonzero = Object.keys(counts).filter(k => counts[k] > 0);
            for (const key of nonzero) {
                const info = DROP_INFO[key], box = document.createElement('div'); box.className = 'result-item';
                box.innerHTML = `<div class="result-icon">${info.icon}</div><div>${info.name}</div><div class="result-number">${counts[key]}</div>`;
                resultCounts.appendChild(box);
            }
            const summary = nonzero.map(k => `${counts[k]} 個${DROP_INFO[k].name}`).join('、');
            document.getElementById('result-message').textContent = summary ? `恭喜！你成功被 ${summary} 活埋！` : '這場雨結束了！所有雨都被擋下了！';
            const qrContainer = document.getElementById('result-qrcode'); qrContainer.innerHTML = '';
            try {
                const url = new URL('https://yzu1122032.github.io/Slang-Rain-Result/');
                for (const key of Object.keys(counts)) url.searchParams.set(key, counts[key]);
                new QRCode(qrContainer, { text: url.toString(), width: 180, height: 180, colorDark: '#142B49', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
            } catch (err) { console.error('QR Code 建立失敗', err); qrContainer.textContent = 'QR Code 暫時無法顯示'; }
            resultScreen.classList.add('show');
            setTimeout(() => location.reload(), RESULT_DISPLAY_TIME);
        }
        let lastActiveCountries = '';
        Events.on(engine, 'beforeUpdate', event => {
            if (gameEnded || !readyForNextGame) return;
            const active = ids.filter(id => states[id].visible);
            if (active.length === 0) { lastActiveCountries = ''; return; }
            const activeKey = active.join('|');
            // 新加入的國家先送出一個對應物件；並重設本輪間隔。
            if (lastActiveCountries && activeKey !== lastActiveCountries) {
                for (const id of active.filter(id => !lastActiveCountries.split('|').includes(id))) {
                    const types = COUNTRIES[id].drops;
                    spawnRain(types[Math.floor(Math.random() * types.length)]);
                }
                spawnTimer = 0;
                nextSpawnTime = nextRainDelay();
            }
            lastActiveCountries = activeKey;
            if (!gameStarted) {
                gameStarted = true;
                spawnTimer = 0;
                nextSpawnTime = nextRainDelay();
                // 初始化本局計時
                idiomElapsedMs = 0;
                idiomTotalMs = MAX_GAME_DURATION;
                idiomLastTick = performance.now();
                idiomMaxProgress = 0;
                // 顯示目前正在遊玩的國家俚語
                syncActiveIdiom(active[0]);
                // 啟動可暫停、可加秒的俚語倒數
                requestAnimationFrame(updateIdiomProgress);
            }
            spawnTimer += event.delta;
            if (spawnTimer < nextSpawnTime) return;
            spawnTimer = 0;
            nextSpawnTime = nextRainDelay();
            // 雙人也共用一份生成量，輪流從正在遊玩的國家取物件。
            const chosen = active[countryDropCursor % active.length];
            countryDropCursor++;
            const types = COUNTRIES[chosen].drops;
            spawnRain(types[Math.floor(Math.random() * types.length)]);
        });
        function cleanup() {
            rainObjects.forEach(body => { if (body.position.x < -150 || body.position.x > innerWidth + 150 || body.position.y > innerHeight + 150) removeRain(body); });
            requestAnimationFrame(cleanup);
        }
        cleanup();
    </script>
